<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bus Sign">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0d10">
<title>Bus Sign</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #15181d;
    --panel-edge: #23272e;
    --text: #e8eaed;
    --muted: #8b929c;
    --accent: #2be0e3;
    --danger: #ff5a6a;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    max-width: 520px; margin: 0 auto;
  }
  h1 { font-size: 22px; margin: 4px 0 16px; letter-spacing: 0.02em; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 10px; }
  section {
    background: var(--panel); border: 1px solid var(--panel-edge); border-radius: var(--radius);
    padding: 16px; margin-bottom: 16px;
  }

  /* Sign preview: 64x32 panel proportions with a dotted LED look */
  .sign {
    position: relative; aspect-ratio: 2 / 1; border-radius: 10px; overflow: hidden; margin-bottom: 14px;
    background-color: #000;
    background-image: radial-gradient(circle, #1a1d22 0.9px, transparent 1.1px);
    background-size: calc(100% / 64) calc(100% / 32);
    display: flex; align-items: center;
  }
  .sign-text {
    white-space: nowrap; font: 700 clamp(22px, 9vw, 40px)/1 "Courier New", ui-monospace, monospace;
    letter-spacing: 0.04em; padding-left: 100%;
    text-shadow: 0 0 8px currentColor;
  }
  .sign-text.fits { padding-left: 0; width: 100%; text-align: center; }
  .sign-text.scrolling { animation: scroll var(--duration, 6s) linear infinite; }
  @keyframes scroll { to { transform: translateX(-100%); } }
  @media (prefers-reduced-motion: reduce) { .sign-text.scrolling { animation: none; padding-left: 8px; } }

  textarea {
    width: 100%; min-height: 76px; resize: vertical; padding: 12px; border-radius: 10px;
    border: 1px solid var(--panel-edge); background: #0f1115; color: var(--text); font: inherit;
  }
  textarea:focus, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .counter { text-align: right; font-size: 13px; color: var(--muted); margin: 4px 2px 12px; }

  .colors { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .swatch {
    width: 40px; height: 40px; border-radius: 50%; border: 2px solid transparent; cursor: pointer;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.35);
  }
  .swatch[aria-pressed="true"] { border-color: var(--text); transform: scale(1.08); }

  .toggle { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; color: var(--muted); }
  .toggle input { width: 22px; height: 22px; accent-color: var(--accent); }

  button.primary, button.secondary {
    width: 100%; padding: 14px; border-radius: 12px; border: 0; cursor: pointer;
    font-family: inherit; font-size: 17px; font-weight: 600; line-height: 1;
  }
  button.primary { background: var(--accent); color: #041314; }
  button.primary:disabled { opacity: 0.5; cursor: default; }
  button.secondary { background: transparent; color: var(--danger); border: 1px solid #3a2328; margin-top: 4px; }

  .status { min-height: 20px; margin-top: 10px; font-size: 14px; color: var(--muted); text-align: center; }
  .status.error { color: var(--danger); }

  ul { list-style: none; margin: 0 0 12px; padding: 0; }
  li {
    display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--panel-edge);
  }
  li:first-child { border-top: 0; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .msg { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .meta { display: block; font-size: 12px; color: var(--muted); }
  .remove { background: none; border: 0; color: var(--muted); font-size: 22px; padding: 4px 8px; cursor: pointer; }
  .empty { color: var(--muted); font-size: 14px; margin: 0; }

  .pin-row { display: flex; gap: 8px; }
  .pin-row input {
    flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--panel-edge);
    background: #0f1115; color: var(--text); font: inherit;
  }
  .pin-row button { width: auto; padding: 12px 18px; }
  [hidden] { display: none !important; }

  .live { padding: 12px; }
  .live-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .live-header h2 { margin: 0; }
  .live-state { font-size: 12px; color: var(--muted); }
  .live-state.ok::before {
    content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #3ddc84; margin-right: 6px; vertical-align: 1px;
  }
  #live { display: block; width: 100%; aspect-ratio: 2 / 1; border-radius: 8px; background: #000; }
  #live.stale { opacity: 0.4; }

  .modes { display: grid; gap: 10px; margin: 0; padding: 0; border: 0; }
  .mode {
    display: flex; align-items: center; gap: 14px; padding: 14px; cursor: pointer;
    background: #0f1115; border: 1px solid var(--panel-edge); border-radius: 12px;
  }
  .mode:has(input:checked) { border-color: var(--accent); background: #0f1d1f; }
  .mode input {
    appearance: none; -webkit-appearance: none; flex: none; margin: 0; width: 22px; height: 22px;
    border-radius: 50%; border: 2px solid #4a505a; display: grid; place-content: center; cursor: pointer;
  }
  .mode input::before {
    content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent);
    transform: scale(0); transition: transform 0.12s;
  }
  .mode input:checked { border-color: var(--accent); }
  .mode input:checked::before { transform: scale(1); }
  .mode input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .mode-name { display: block; font-weight: 600; }
  .mode-desc { display: block; font-size: 13px; color: var(--muted); }

  .tabs {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; padding: 4px; margin-bottom: 16px;
    background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 12px;
  }
  .tabs button {
    padding: 10px; border: 0; border-radius: 9px; background: transparent; color: var(--muted);
    font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .tabs button[aria-selected="true"] { background: #23272e; color: var(--text); }

  .setting { padding: 12px 0; border-top: 1px solid var(--panel-edge); }
  .setting:first-of-type { border-top: 0; padding-top: 0; }
  .setting.disabled { opacity: 0.45; }
  .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .setting label, .setting .label { font-size: 15px; }
  .value { color: var(--accent); font-variant-numeric: tabular-nums; font-size: 15px; }
  input[type="range"] { width: 100%; margin-top: 10px; accent-color: var(--accent); }
  select {
    padding: 9px 10px; border-radius: 10px; border: 1px solid var(--panel-edge);
    background: #0f1115; color: var(--text); font: inherit; font-size: 15px; max-width: 60%;
  }
  input.text-setting {
    width: 55%; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--panel-edge);
    background: #0f1115; color: var(--text); font: inherit; font-size: 15px;
  }
  .switch { position: relative; width: 50px; height: 30px; flex: none; }
  .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; cursor: pointer; }
  .switch span {
    position: absolute; inset: 0; border-radius: 15px; background: #3a3f47; transition: background 0.15s;
    pointer-events: none;
  }
  .switch span::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%;
    background: #fff; transition: transform 0.15s;
  }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(20px); }
  .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
  <h1>Bus Sign</h1>

  <section id="pin-section" hidden>
    <h2>Enter PIN</h2>
    <form class="pin-row" id="pin-form">
      <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" aria-label="PIN">
      <button class="primary" type="submit">Unlock</button>
    </form>
    <div class="status error" id="pin-status" role="alert"></div>
  </section>

  <div id="app">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-btn-sign" aria-selected="true" aria-controls="tab-sign">Sign</button>
      <button type="button" role="tab" id="tab-btn-messages" aria-selected="false" aria-controls="tab-messages">Message</button>
      <button type="button" role="tab" id="tab-btn-settings" aria-selected="false" aria-controls="tab-settings">Settings</button>
    </div>

    <div id="tab-sign" role="tabpanel" aria-labelledby="tab-btn-sign">
      <section class="live">
        <div class="live-header">
          <h2>On the sign now</h2>
          <span class="live-state" id="live-state" role="status">Connecting…</span>
        </div>
        <canvas id="live" width="640" height="320" role="img" aria-label="Live view of the sign"></canvas>
      </section>

      <section>
        <h2 id="modes-heading">Mode</h2>
        <fieldset class="modes" id="modes" role="radiogroup" aria-labelledby="modes-heading">
          <label class="mode">
            <input type="radio" name="mode" value="normal">
            <span><span class="mode-name">Normal</span><span class="mode-desc">Clock, weather &amp; bus times</span></span>
          </label>
          <label class="mode">
            <input type="radio" name="mode" value="music">
            <span><span class="mode-name">Music</span><span class="mode-desc">Album cover with the song and artist</span></span>
          </label>
          <label class="mode">
            <input type="radio" name="mode" value="sports">
            <span><span class="mode-name">Sports</span><span class="mode-desc">This week's football games, on a loop</span></span>
          </label>
        </fieldset>
        <div class="status" id="mode-status" role="status" aria-live="polite"></div>
      </section>
    </div>

    <div id="tab-messages" role="tabpanel" aria-labelledby="tab-btn-messages" hidden>
    <section>
      <h2>Send a message</h2>
      <div class="sign" aria-hidden="true"><div class="sign-text fits" id="preview">HELLO</div></div>
      <form id="message-form">
        <textarea id="text" maxlength="100" placeholder="Dinner's ready!" aria-label="Message"></textarea>
        <div class="counter"><span id="count">0</span>/<span id="max">100</span></div>
        <div class="colors" id="colors" role="group" aria-label="Color"></div>
        <label class="toggle"><input type="checkbox" id="repeat"> Repeat every 5 minutes for an hour</label>
        <button class="primary" type="submit" id="send">Send to sign</button>
        <div class="status" id="status" role="status" aria-live="polite"></div>
      </form>
    </section>

    <section>
      <h2>Queued</h2>
      <ul id="queue"></ul>
      <p class="empty" id="empty">Nothing queued.</p>
      <button class="secondary" type="button" id="clear" hidden>Clear all</button>
    </section>
    </div>

    <div id="tab-settings" role="tabpanel" aria-labelledby="tab-btn-settings" hidden>
      <div id="settings"></div>
      <div class="status" id="settings-status" role="status" aria-live="polite"></div>
    </div>
  </div>

<script>
  const COLOR_VALUES = {
    white: "#ffffff", red: "#dc1e32", gold: "#ffbe00", green: "#00dc5a", cyan: "#2be0e3", pink: "#d60bb4",
  };
  const $ = (id) => document.getElementById(id);
  let color = "white";
  let pin = "";
  try { pin = localStorage.getItem("signPin") || ""; } catch (e) {}

  function savePin(value) {
    pin = value;
    try { localStorage.setItem("signPin", value); } catch (e) {}
  }

  async function api(method, path, body) {
    const options = { method, headers: { "X-Pin": pin } };
    if (body !== undefined) {
      options.headers["Content-Type"] = "application/json";
      options.body = JSON.stringify(body);
    }
    const response = await fetch(path, options);
    const data = await response.json().catch(() => ({}));
    if (response.status === 401) {
      showPin();
      throw new Error("PIN required");
    }
    if (!response.ok) throw new Error(data.error || "Something went wrong");
    return data;
  }

  function showPin(message) {
    $("app").hidden = true;
    $("pin-section").hidden = false;
    $("pin-status").textContent = message || "";
    $("pin").focus();
  }

  function setStatus(text, isError) {
    $("status").textContent = text;
    $("status").classList.toggle("error", !!isError);
  }

  function updatePreview() {
    const text = $("text").value.trim() || "HELLO";
    const preview = $("preview");
    preview.textContent = text;
    preview.style.color = COLOR_VALUES[color];
    // Roughly 9 characters fit on the 64px sign before it has to scroll
    const fits = text.length <= 9;
    preview.classList.toggle("fits", fits);
    preview.classList.toggle("scrolling", !fits);
    preview.style.setProperty("--duration", Math.max(4, text.length * 0.25) + "s");
    $("count").textContent = $("text").value.length;
  }

  function renderColors(names) {
    const group = $("colors");
    group.innerHTML = "";
    names.forEach((name) => {
      const swatch = document.createElement("button");
      swatch.type = "button";
      swatch.className = "swatch";
      swatch.style.background = COLOR_VALUES[name] || name;
      swatch.setAttribute("aria-label", name);
      swatch.setAttribute("aria-pressed", String(name === color));
      swatch.addEventListener("click", () => {
        color = name;
        group.querySelectorAll(".swatch").forEach((s) => s.setAttribute("aria-pressed", String(s === swatch)));
        updatePreview();
      });
      group.appendChild(swatch);
    });
  }

  function renderQueue(messages) {
    const list = $("queue");
    list.innerHTML = "";
    messages.forEach((m) => {
      const item = document.createElement("li");
      const dot = document.createElement("span");
      dot.className = "dot";
      dot.style.background = COLOR_VALUES[m.color] || "#fff";
      const text = document.createElement("span");
      text.className = "msg";
      text.textContent = m.text;
      const meta = document.createElement("span");
      meta.className = "meta";
      meta.textContent = m.repeat ? `Repeating · ${m.minutes_left} min left` : "Waiting to show";
      text.appendChild(meta);
      const remove = document.createElement("button");
      remove.className = "remove";
      remove.type = "button";
      remove.textContent = "×";
      remove.setAttribute("aria-label", `Remove "${m.text}"`);
      remove.addEventListener("click", async () => {
        try { await api("DELETE", `/api/messages/${m.id}`); refresh(); } catch (e) { setStatus(e.message, true); }
      });
      item.append(dot, text, remove);
      list.appendChild(item);
    });
    $("empty").hidden = messages.length > 0;
    $("clear").hidden = messages.length === 0;
  }

  let colorsRendered = false;
  async function refresh() {
    try {
      const data = await api("GET", "/api/messages");
      $("pin-section").hidden = true;
      $("app").hidden = false;
      if (!colorsRendered) {
        renderColors(data.colors);
        $("max").textContent = data.max_length;
        $("text").maxLength = data.max_length;
        colorsRendered = true;
      }
      renderQueue(data.messages);
    } catch (e) {
      if (e.message !== "PIN required") setStatus("Can't reach the sign", true);
    }
  }

  $("text").addEventListener("input", updatePreview);

  $("message-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const text = $("text").value.trim();
    if (!text) { setStatus("Type a message first", true); return; }
    $("send").disabled = true;
    try {
      await api("POST", "/api/messages", { text, color, repeat: $("repeat").checked });
      $("text").value = "";
      updatePreview();
      setStatus("Sent! It'll show on the sign in a moment.");
      refresh();
    } catch (e) {
      setStatus(e.message, true);
    } finally {
      $("send").disabled = false;
    }
  });

  $("clear").addEventListener("click", async () => {
    try { await api("DELETE", "/api/messages"); setStatus("Cleared."); refresh(); } catch (e) { setStatus(e.message, true); }
  });

  $("pin-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    savePin($("pin").value);
    try { await api("GET", "/api/messages"); refresh(); } catch (e) { showPin("That PIN didn't work"); }
  });

  // ---- Tabs ----
  function showTab(name) {
    ["sign", "messages", "settings"].forEach((tab) => {
      $("tab-" + tab).hidden = tab !== name;
      $("tab-btn-" + tab).setAttribute("aria-selected", String(tab === name));
    });
    if (name === "settings") loadSettings();
    if (name === "sign") { loadMode(); updateLive(); }
  }
  $("tab-btn-sign").addEventListener("click", () => showTab("sign"));
  $("tab-btn-messages").addEventListener("click", () => showTab("messages"));
  $("tab-btn-settings").addEventListener("click", () => showTab("settings"));

  // ---- Mode (radio cards on the Sign tab) ----
  const modeInputs = () => document.querySelectorAll('#modes input[name="mode"]');
  let modeSaving = false;

  function showMode(mode) {
    modeInputs().forEach((input) => { input.checked = input.value === mode; });
  }

  async function loadMode() {
    if (modeSaving) return;  // don't overwrite a switch that's still being saved
    try {
      const data = await api("GET", "/api/settings");
      settingValues = data.values;
      showMode(data.values.display_mode);
    } catch (e) {
      if (e.message !== "PIN required") $("mode-status").textContent = "Can't reach the sign";
    }
  }

  modeInputs().forEach((input) => {
    input.addEventListener("change", async () => {
      const previous = settingValues.display_mode;
      modeSaving = true;
      modeInputs().forEach((i) => { i.disabled = true; });
      $("mode-status").textContent = "Switching…";
      $("mode-status").classList.remove("error");
      try {
        const data = await api("POST", "/api/settings", { display_mode: input.value });
        settingValues = data.values;
        $("mode-status").textContent = "";
        updateLive();
      } catch (e) {
        showMode(previous);
        $("mode-status").textContent = e.message;
        $("mode-status").classList.add("error");
      } finally {
        modeSaving = false;
        modeInputs().forEach((i) => { i.disabled = false; });
      }
    });
  });

  // ---- Settings (rendered from the fields the sign sends) ----
  let settingValues = {};

  function hourLabel(hour) {
    const h = hour % 12 === 0 ? 12 : hour % 12;
    return `${h}:00 ${hour < 12 ? "AM" : "PM"}`;
  }

  function setSettingsStatus(text, isError) {
    $("settings-status").textContent = text;
    $("settings-status").classList.toggle("error", !!isError);
  }

  async function saveSetting(key, value) {
    setSettingsStatus("Saving…");
    try {
      const data = await api("POST", "/api/settings", { [key]: value });
      settingValues = data.values;
      setSettingsStatus("Saved");
      updateDependentSettings();
    } catch (e) {
      await loadSettings();  // put the controls back to what the sign actually has
      setSettingsStatus(e.message, true);
    }
  }

  function updateDependentSettings() {
    // Off/on hours only matter while overnight screen-off is turned on
    const offEnabled = settingValues.screen_off_enabled;
    ["screen_off_start", "screen_off_end"].forEach((key) => {
      const row = document.querySelector(`[data-setting="${key}"]`);
      if (!row) return;
      row.classList.toggle("disabled", !offEnabled);
      row.querySelector("select").disabled = !offEnabled;
    });
  }

  function renderSettings(fields) {
    const container = $("settings");
    container.innerHTML = "";
    const sections = {};
    // Display mode has its own controls on the Sign tab
    fields.filter((field) => field.key !== "display_mode").forEach((field) => {
      if (!sections[field.section]) {
        const section = document.createElement("section");
        const heading = document.createElement("h2");
        heading.textContent = field.section;
        section.appendChild(heading);
        container.appendChild(section);
        sections[field.section] = section;
      }
      const row = document.createElement("div");
      row.className = "setting";
      row.dataset.setting = field.key;
      const id = "setting-" + field.key;
      const value = settingValues[field.key];

      if (field.type === "range") {
        row.innerHTML = `<div class="setting-row"><label for="${id}"></label><span class="value"></span></div>
          <input type="range" id="${id}" min="${field.min}" max="${field.max}" step="1">`;
        const input = row.querySelector("input");
        const shown = row.querySelector(".value");
        input.value = value;
        shown.textContent = value + "%";
        input.addEventListener("input", () => { shown.textContent = input.value + "%"; });
        input.addEventListener("change", () => saveSetting(field.key, Number(input.value)));
      } else if (field.type === "text") {
        row.innerHTML = `<div class="setting-row"><label for="${id}"></label>
          <input type="text" class="text-setting" id="${id}" autocomplete="off" autocapitalize="off" spellcheck="false"></div>`;
        const input = row.querySelector("input");
        input.value = value;
        input.maxLength = field.max_length || 40;
        input.placeholder = field.placeholder || "";
        // Saves when you finish editing (tap away or press return)
        input.addEventListener("change", () => saveSetting(field.key, input.value.trim()));
        input.addEventListener("keydown", (e) => { if (e.key === "Enter") input.blur(); });
      } else if (field.type === "toggle") {
        row.innerHTML = `<div class="setting-row"><label for="${id}"></label>
          <span class="switch"><input type="checkbox" role="switch" id="${id}"><span></span></span></div>`;
        const input = row.querySelector("input");
        input.checked = !!value;
        input.addEventListener("change", () => saveSetting(field.key, input.checked));
      } else {
        // "hour" and "choice" are both dropdowns
        row.innerHTML = `<div class="setting-row"><label for="${id}"></label><select id="${id}"></select></div>`;
        const select = row.querySelector("select");
        const options = field.type === "hour"
          ? Array.from({ length: 24 }, (_, hour) => [hour, hourLabel(hour)])
          : field.options;
        options.forEach(([optionValue, label]) => {
          const option = document.createElement("option");
          option.value = String(optionValue);
          option.textContent = label;
          select.appendChild(option);
        });
        select.value = String(value);
        select.addEventListener("change", () => {
          saveSetting(field.key, field.type === "hour" ? Number(select.value) : select.value);
        });
      }
      row.querySelector("label").textContent = field.label;
      sections[field.section].appendChild(row);
    });
    updateDependentSettings();
  }

  async function loadSettings() {
    try {
      const data = await api("GET", "/api/settings");
      settingValues = data.values;
      renderSettings(data.fields);
      setSettingsStatus("");
    } catch (e) {
      if (e.message !== "PIN required") setSettingsStatus("Can't reach the sign", true);
    }
  }

  // ---- Live view: the sign's current frame, drawn as LED dots ----
  const LIVE_INTERVAL_MS = 250;
  const liveCanvas = $("live");
  const liveContext = liveCanvas.getContext("2d");
  const pixelCanvas = document.createElement("canvas");
  pixelCanvas.width = 64;
  pixelCanvas.height = 32;
  const pixelContext = pixelCanvas.getContext("2d", { willReadFrequently: true });
  let liveTimer = null;
  let liveBusy = false;

  function drawLeds(imageData) {
    const cell = liveCanvas.width / 64;
    const radius = cell * 0.42;
    liveContext.fillStyle = "#000";
    liveContext.fillRect(0, 0, liveCanvas.width, liveCanvas.height);
    const px = imageData.data;
    for (let y = 0; y < 32; y++) {
      for (let x = 0; x < 64; x++) {
        const i = (y * 64 + x) * 4;
        const lit = px[i] || px[i + 1] || px[i + 2];
        liveContext.fillStyle = lit ? `rgb(${px[i]},${px[i + 1]},${px[i + 2]})` : "#14171b";
        liveContext.beginPath();
        liveContext.arc((x + 0.5) * cell, (y + 0.5) * cell, radius, 0, Math.PI * 2);
        liveContext.fill();
      }
    }
  }

  async function updateLive() {
    if (liveBusy || document.hidden || $("app").hidden || $("tab-sign").hidden) return;
    liveBusy = true;
    try {
      const response = await fetch("/api/screen.png", { headers: { "X-Pin": pin }, cache: "no-store" });
      if (!response.ok) throw new Error(response.status);
      const bitmap = await createImageBitmap(await response.blob());
      pixelContext.clearRect(0, 0, 64, 32);
      pixelContext.drawImage(bitmap, 0, 0);
      drawLeds(pixelContext.getImageData(0, 0, 64, 32));
      liveCanvas.classList.remove("stale");
      $("live-state").textContent = "Live";
      $("live-state").className = "live-state ok";
    } catch (e) {
      liveCanvas.classList.add("stale");
      $("live-state").textContent = "Can't reach the sign";
      $("live-state").className = "live-state";
    } finally {
      liveBusy = false;
    }
  }

  function startLive() {
    if (!liveTimer) liveTimer = setInterval(updateLive, LIVE_INTERVAL_MS);
    updateLive();
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) updateLive(); });

  updatePreview();
  refresh();
  loadMode();
  startLive();
  setInterval(() => { if (!document.hidden) refresh(); }, 10000);
  // Keep the mode in sync if it's changed from another phone
  setInterval(() => { if (!document.hidden && !$("tab-sign").hidden) loadMode(); }, 5000);
</script>
</body>
</html>
