<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bus Sign">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0d10">
<title>Bus Sign</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #15181d;
    --panel-edge: #23272e;
    --text: #e8eaed;
    --muted: #8b929c;
    --accent: #2be0e3;
    --danger: #ff5a6a;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    max-width: 520px; margin: 0 auto;
  }
  h1 { font-size: 22px; margin: 4px 0 16px; letter-spacing: 0.02em; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 10px; }
  section {
    background: var(--panel); border: 1px solid var(--panel-edge); border-radius: var(--radius);
    padding: 16px; margin-bottom: 16px;
  }

  /* Sign preview: 64x32 panel proportions with a dotted LED look */
  .sign {
    position: relative; aspect-ratio: 2 / 1; border-radius: 10px; overflow: hidden; margin-bottom: 14px;
    background-color: #000;
    background-image: radial-gradient(circle, #1a1d22 0.9px, transparent 1.1px);
    background-size: calc(100% / 64) calc(100% / 32);
    display: flex; align-items: center;
  }
  .sign-text {
    white-space: nowrap; font: 700 clamp(22px, 9vw, 40px)/1 "Courier New", ui-monospace, monospace;
    letter-spacing: 0.04em; padding-left: 100%;
    text-shadow: 0 0 8px currentColor;
  }
  .sign-text.fits { padding-left: 0; width: 100%; text-align: center; }
  .sign-text.scrolling { animation: scroll var(--duration, 6s) linear infinite; }
  @keyframes scroll { to { transform: translateX(-100%); } }
  @media (prefers-reduced-motion: reduce) { .sign-text.scrolling { animation: none; padding-left: 8px; } }

  textarea {
    width: 100%; min-height: 76px; resize: vertical; padding: 12px; border-radius: 10px;
    border: 1px solid var(--panel-edge); background: #0f1115; color: var(--text); font: inherit;
  }
  textarea:focus, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .counter { text-align: right; font-size: 13px; color: var(--muted); margin: 4px 2px 12px; }

  .colors { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .swatch {
    width: 40px; height: 40px; border-radius: 50%; border: 2px solid transparent; cursor: pointer;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.35);
  }
  .swatch[aria-pressed="true"] { border-color: var(--text); transform: scale(1.08); }

  .toggle { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; color: var(--muted); }
  .toggle input { width: 22px; height: 22px; accent-color: var(--accent); }

  button.primary, button.secondary {
    width: 100%; padding: 14px; border-radius: 12px; border: 0; cursor: pointer;
    font-family: inherit; font-size: 17px; font-weight: 600; line-height: 1;
  }
  button.primary { background: var(--accent); color: #041314; }
  button.primary:disabled { opacity: 0.5; cursor: default; }
  button.secondary { background: transparent; color: var(--danger); border: 1px solid #3a2328; margin-top: 4px; }

  .status { min-height: 20px; margin-top: 10px; font-size: 14px; color: var(--muted); text-align: center; }
  .status.error { color: var(--danger); }

  ul { list-style: none; margin: 0 0 12px; padding: 0; }
  li {
    display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--panel-edge);
  }
  li:first-child { border-top: 0; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .msg { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .meta { display: block; font-size: 12px; color: var(--muted); }
  .remove { background: none; border: 0; color: var(--muted); font-size: 22px; padding: 4px 8px; cursor: pointer; }
  .empty { color: var(--muted); font-size: 14px; margin: 0; }

  .pin-row { display: flex; gap: 8px; }
  .pin-row input {
    flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--panel-edge);
    background: #0f1115; color: var(--text); font: inherit;
  }
  .pin-row button { width: auto; padding: 12px 18px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <h1>Bus Sign</h1>

  <section id="pin-section" hidden>
    <h2>Enter PIN</h2>
    <form class="pin-row" id="pin-form">
      <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" aria-label="PIN">
      <button class="primary" type="submit">Unlock</button>
    </form>
    <div class="status error" id="pin-status" role="alert"></div>
  </section>

  <div id="app">
    <section>
      <h2>Send a message</h2>
      <div class="sign" aria-hidden="true"><div class="sign-text fits" id="preview">HELLO</div></div>
      <form id="message-form">
        <textarea id="text" maxlength="100" placeholder="Dinner's ready!" aria-label="Message"></textarea>
        <div class="counter"><span id="count">0</span>/<span id="max">100</span></div>
        <div class="colors" id="colors" role="group" aria-label="Color"></div>
        <label class="toggle"><input type="checkbox" id="repeat"> Repeat every 5 minutes for an hour</label>
        <button class="primary" type="submit" id="send">Send to sign</button>
        <div class="status" id="status" role="status" aria-live="polite"></div>
      </form>
    </section>

    <section>
      <h2>Queued</h2>
      <ul id="queue"></ul>
      <p class="empty" id="empty">Nothing queued.</p>
      <button class="secondary" type="button" id="clear" hidden>Clear all</button>
    </section>
  </div>

<script>
  const COLOR_VALUES = {
    white: "#ffffff", red: "#dc1e32", gold: "#ffbe00", green: "#00dc5a", cyan: "#2be0e3", pink: "#d60bb4",
  };
  const $ = (id) => document.getElementById(id);
  let color = "white";
  let pin = "";
  try { pin = localStorage.getItem("signPin") || ""; } catch (e) {}

  function savePin(value) {
    pin = value;
    try { localStorage.setItem("signPin", value); } catch (e) {}
  }

  async function api(method, path, body) {
    const options = { method, headers: { "X-Pin": pin } };
    if (body !== undefined) {
      options.headers["Content-Type"] = "application/json";
      options.body = JSON.stringify(body);
    }
    const response = await fetch(path, options);
    const data = await response.json().catch(() => ({}));
    if (response.status === 401) {
      showPin();
      throw new Error("PIN required");
    }
    if (!response.ok) throw new Error(data.error || "Something went wrong");
    return data;
  }

  function showPin(message) {
    $("app").hidden = true;
    $("pin-section").hidden = false;
    $("pin-status").textContent = message || "";
    $("pin").focus();
  }

  function setStatus(text, isError) {
    $("status").textContent = text;
    $("status").classList.toggle("error", !!isError);
  }

  function updatePreview() {
    const text = $("text").value.trim() || "HELLO";
    const preview = $("preview");
    preview.textContent = text;
    preview.style.color = COLOR_VALUES[color];
    // Roughly 9 characters fit on the 64px sign before it has to scroll
    const fits = text.length <= 9;
    preview.classList.toggle("fits", fits);
    preview.classList.toggle("scrolling", !fits);
    preview.style.setProperty("--duration", Math.max(4, text.length * 0.25) + "s");
    $("count").textContent = $("text").value.length;
  }

  function renderColors(names) {
    const group = $("colors");
    group.innerHTML = "";
    names.forEach((name) => {
      const swatch = document.createElement("button");
      swatch.type = "button";
      swatch.className = "swatch";
      swatch.style.background = COLOR_VALUES[name] || name;
      swatch.setAttribute("aria-label", name);
      swatch.setAttribute("aria-pressed", String(name === color));
      swatch.addEventListener("click", () => {
        color = name;
        group.querySelectorAll(".swatch").forEach((s) => s.setAttribute("aria-pressed", String(s === swatch)));
        updatePreview();
      });
      group.appendChild(swatch);
    });
  }

  function renderQueue(messages) {
    const list = $("queue");
    list.innerHTML = "";
    messages.forEach((m) => {
      const item = document.createElement("li");
      const dot = document.createElement("span");
      dot.className = "dot";
      dot.style.background = COLOR_VALUES[m.color] || "#fff";
      const text = document.createElement("span");
      text.className = "msg";
      text.textContent = m.text;
      const meta = document.createElement("span");
      meta.className = "meta";
      meta.textContent = m.repeat ? `Repeating · ${m.minutes_left} min left` : "Waiting to show";
      text.appendChild(meta);
      const remove = document.createElement("button");
      remove.className = "remove";
      remove.type = "button";
      remove.textContent = "×";
      remove.setAttribute("aria-label", `Remove "${m.text}"`);
      remove.addEventListener("click", async () => {
        try { await api("DELETE", `/api/messages/${m.id}`); refresh(); } catch (e) { setStatus(e.message, true); }
      });
      item.append(dot, text, remove);
      list.appendChild(item);
    });
    $("empty").hidden = messages.length > 0;
    $("clear").hidden = messages.length === 0;
  }

  let colorsRendered = false;
  async function refresh() {
    try {
      const data = await api("GET", "/api/messages");
      $("pin-section").hidden = true;
      $("app").hidden = false;
      if (!colorsRendered) {
        renderColors(data.colors);
        $("max").textContent = data.max_length;
        $("text").maxLength = data.max_length;
        colorsRendered = true;
      }
      renderQueue(data.messages);
    } catch (e) {
      if (e.message !== "PIN required") setStatus("Can't reach the sign", true);
    }
  }

  $("text").addEventListener("input", updatePreview);

  $("message-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const text = $("text").value.trim();
    if (!text) { setStatus("Type a message first", true); return; }
    $("send").disabled = true;
    try {
      await api("POST", "/api/messages", { text, color, repeat: $("repeat").checked });
      $("text").value = "";
      updatePreview();
      setStatus("Sent! It'll show on the sign in a moment.");
      refresh();
    } catch (e) {
      setStatus(e.message, true);
    } finally {
      $("send").disabled = false;
    }
  });

  $("clear").addEventListener("click", async () => {
    try { await api("DELETE", "/api/messages"); setStatus("Cleared."); refresh(); } catch (e) { setStatus(e.message, true); }
  });

  $("pin-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    savePin($("pin").value);
    try { await api("GET", "/api/messages"); refresh(); } catch (e) { showPin("That PIN didn't work"); }
  });

  updatePreview();
  refresh();
  setInterval(() => { if (!document.hidden) refresh(); }, 10000);
</script>
</body>
</html>
