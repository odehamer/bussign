<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bus Sign">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0d10">
<title>Bus Sign</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #15181d;
    --panel-edge: #23272e;
    --text: #e8eaed;
    --muted: #8b929c;
    --accent: #2be0e3;
    --danger: #ff5a6a;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    max-width: 520px; margin: 0 auto;
  }
  h1 { font-size: 22px; margin: 4px 0 16px; letter-spacing: 0.02em; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 10px; }
  section {
    background: var(--panel); border: 1px solid var(--panel-edge); border-radius: var(--radius);
    padding: 16px; margin-bottom: 16px;
  }

  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  button.primary {
    width: 100%; padding: 14px; border-radius: 12px; border: 0; cursor: pointer;
    font-family: inherit; font-size: 17px; font-weight: 600; line-height: 1;
  }
  button.primary { background: var(--accent); color: #041314; }
  button.primary:disabled { opacity: 0.5; cursor: default; }

  .status { min-height: 20px; margin-top: 10px; font-size: 14px; color: var(--muted); text-align: center; }
  .status.error { color: var(--danger); }

  .pin-row { display: flex; gap: 8px; }
  .pin-row input {
    flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--panel-edge);
    background: #0f1115; color: var(--text); font: inherit;
  }
  .pin-row button { width: auto; padding: 12px 18px; }
  [hidden] { display: none !important; }

  .live { padding: 12px; }
  .live-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .live-header h2 { margin: 0; }
  .live-state { font-size: 12px; color: var(--muted); }
  .live-state.ok::before {
    content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #3ddc84; margin-right: 6px; vertical-align: 1px;
  }
  #live { display: block; width: 100%; aspect-ratio: 2 / 1; border-radius: 8px; background: #000; }
  #live.stale { opacity: 0.4; }

  .modes { display: grid; gap: 10px; margin: 0; padding: 0; border: 0; }
  .mode {
    display: flex; align-items: center; gap: 14px; padding: 14px; cursor: pointer;
    background: #0f1115; border: 1px solid var(--panel-edge); border-radius: 12px;
  }
  .mode:has(input:checked) { border-color: var(--accent); background: #0f1d1f; }
  .mode input {
    appearance: none; -webkit-appearance: none; flex: none; margin: 0; width: 22px; height: 22px;
    border-radius: 50%; border: 2px solid #4a505a; display: grid; place-content: center; cursor: pointer;
  }
  .mode input::before {
    content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent);
    transform: scale(0); transition: transform 0.12s;
  }
  .mode input:checked { border-color: var(--accent); }
  .mode input:checked::before { transform: scale(1); }
  .mode input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .mode-name { display: block; font-weight: 600; }
  .mode-desc { display: block; font-size: 13px; color: var(--muted); }
  .mode-now { display: block; margin-top: 2px; color: var(--accent); }
  .scenes { display: flex; flex-wrap: wrap; gap: 8px; margin: -2px 0 2px 34px; padding: 0; border: 0; }
  .scene {
    padding: 8px 14px; border-radius: 999px; border: 1px solid var(--panel-edge); background: #0f1115;
    font-size: 14px; cursor: pointer;
  }
  .scene input { position: absolute; opacity: 0; pointer-events: none; }
  .scene:has(input:checked) { border-color: var(--accent); background: #0f1d1f; color: var(--accent); }
  .scene:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }

  .bj-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .bj-header h2 { margin: 0; }
  .bj-chips { font-size: 15px; color: var(--muted); }
  .bj-chips strong { color: #ffbe00; }
  .bj-hands { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0 0 14px; font-size: 17px; }
  .bj-hands dt { color: var(--muted); font-size: 14px; align-self: center; }
  .bj-hands dd { margin: 0; font-variant-numeric: tabular-nums; }
  .bj-hands .red { color: #ff6b6b; }
  .bj-bets { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 10px; }
  .bj-bets button, .bj-play button, .bj-rebuy {
    padding: 11px 4px; border-radius: 10px; border: 1px solid var(--panel-edge); background: #0f1115;
    color: var(--text); font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .bj-bets button[aria-pressed="true"] { border-color: #ffbe00; color: #ffbe00; background: #1d1a0f; }
  .bj-bets button:disabled, .bj-play button:disabled { opacity: 0.4; cursor: default; }
  .bj-play { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .bj-play button { padding: 14px 4px; font-size: 17px; }
  .bj-rebuy { width: 100%; margin-top: 10px; }

  .hm-word { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 4px 0 12px; }
  .hm-word span {
    width: 26px; padding-bottom: 2px; border-bottom: 2px solid #4a505a; text-align: center;
    font-size: 22px; font-weight: 700; min-height: 32px;
  }
  .hm-word.won span { color: #3ddc84; }
  .hm-word.lost span.missed { color: var(--danger); }
  .hm-misses { text-align: center; font-size: 14px; color: var(--muted); margin-bottom: 12px; }
  .hm-misses strong { color: var(--danger); letter-spacing: 0.1em; }
  .hm-keys { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .hm-keys button, .hm-secondary {
    padding: 11px 0; border-radius: 10px; border: 1px solid var(--panel-edge); background: #0f1115;
    color: var(--text); font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .hm-keys button.hit { color: #3ddc84; border-color: #1f4a30; }
  .hm-keys button.miss { color: var(--danger); border-color: #3a2328; }
  .hm-keys button:disabled { opacity: 0.55; cursor: default; }
  .hm-secondary { width: 100%; margin-top: 10px; }
  .hm-setup input {
    width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; border: 1px solid var(--panel-edge);
    background: #0f1115; color: var(--text); font: inherit; font-size: 18px; letter-spacing: 0.1em;
  }
  .hm-hint { font-size: 13px; color: var(--muted); margin: 0 0 10px; }

  .tabs {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; padding: 4px; margin-bottom: 16px;
    background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 12px;
  }
  .tabs button {
    padding: 10px; border: 0; border-radius: 9px; background: transparent; color: var(--muted);
    font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .tabs button[aria-selected="true"] { background: #23272e; color: var(--text); }

  .setting { padding: 12px 0; border-top: 1px solid var(--panel-edge); }
  .setting:first-of-type { border-top: 0; padding-top: 0; }
  .setting.disabled { opacity: 0.45; }
  .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .setting label, .setting .label { font-size: 15px; }
  .value { color: var(--accent); font-variant-numeric: tabular-nums; font-size: 15px; }
  input[type="range"] { width: 100%; margin-top: 10px; accent-color: var(--accent); }
  select {
    padding: 9px 10px; border-radius: 10px; border: 1px solid var(--panel-edge);
    background: #0f1115; color: var(--text); font: inherit; font-size: 15px; max-width: 60%;
  }
  input.text-setting {
    width: 55%; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--panel-edge);
    background: #0f1115; color: var(--text); font: inherit; font-size: 15px;
  }
  .switch { position: relative; width: 50px; height: 30px; flex: none; }
  .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; cursor: pointer; }
  .switch span {
    position: absolute; inset: 0; border-radius: 15px; background: #3a3f47; transition: background 0.15s;
    pointer-events: none;
  }
  .switch span::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%;
    background: #fff; transition: transform 0.15s;
  }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(20px); }
  .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Pixel painter */
  .paint-wrap { position: relative; }
  #paint {
    display: block; width: 100%; aspect-ratio: 2 / 1; border-radius: 8px; background: #000;
    touch-action: none; cursor: crosshair;
  }
  .tools, .palette, .draw-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .tool {
    flex: 1; min-width: 60px; padding: 10px 6px; border-radius: 10px; border: 1px solid var(--panel-edge);
    background: #0f1115; color: var(--muted); font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .tool[aria-pressed="true"] { border-color: var(--accent); color: var(--text); background: #0f1d1f; }
  .color {
    width: 34px; height: 34px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.35);
  }
  .color[aria-pressed="true"] { border-color: var(--text); transform: scale(1.1); }
  .custom-color { position: relative; width: 34px; height: 34px; }
  .custom-color input {
    position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; border-radius: 50%;
    background: none; cursor: pointer;
  }
  .draw-actions button {
    flex: 1; padding: 11px; border-radius: 10px; border: 1px solid var(--panel-edge); background: #0f1115;
    color: var(--text); font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .draw-actions button.danger { color: var(--danger); border-color: #3a2328; }
  .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .thumb { position: relative; }
  .thumb button.open {
    display: block; width: 100%; padding: 0; border: 1px solid var(--panel-edge); border-radius: 6px;
    background: #000; cursor: pointer; overflow: hidden;
  }
  .thumb img { display: block; width: 100%; aspect-ratio: 2 / 1; image-rendering: pixelated; }
  .thumb button.delete {
    position: absolute; top: -8px; right: -8px; width: 24px; height: 24px; border-radius: 50%; border: 0;
    background: #2a2e35; color: var(--text); font-size: 15px; line-height: 1; cursor: pointer;
  }
  .empty { color: var(--muted); font-size: 14px; margin: 0; }
</style>
</head>
<body>
  <h1>Bus Sign</h1>

  <section id="pin-section" hidden>
    <h2>Enter PIN</h2>
    <form class="pin-row" id="pin-form">
      <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" aria-label="PIN">
      <button class="primary" type="submit">Unlock</button>
    </form>
    <div class="status error" id="pin-status" role="alert"></div>
  </section>

  <div id="app">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-btn-sign" aria-selected="true" aria-controls="tab-sign">Sign</button>
      <button type="button" role="tab" id="tab-btn-draw" aria-selected="false" aria-controls="tab-draw">Draw</button>
      <button type="button" role="tab" id="tab-btn-settings" aria-selected="false" aria-controls="tab-settings">Settings</button>
    </div>

    <div id="tab-sign" role="tabpanel" aria-labelledby="tab-btn-sign">
      <section class="live">
        <div class="live-header">
          <h2>On the sign now</h2>
          <span class="live-state" id="live-state" role="status">Connecting…</span>
        </div>
        <canvas id="live" width="640" height="320" role="img" aria-label="Live view of the sign"></canvas>
      </section>

      <section id="blackjack" hidden>
        <div class="bj-header">
          <h2>Blackjack</h2>
          <span class="bj-chips">Chips <strong id="bj-chips"></strong></span>
        </div>
        <dl class="bj-hands">
          <dt>Dealer</dt><dd id="bj-dealer">&mdash;</dd>
          <dt>You</dt><dd id="bj-player">&mdash;</dd>
        </dl>
        <div class="bj-bets" id="bj-bets" role="group" aria-label="Bet size"></div>
        <button class="primary" type="button" id="bj-deal">Deal</button>
        <div class="bj-play" id="bj-play" hidden>
          <button type="button" id="bj-hit">Hit</button>
          <button type="button" id="bj-stand">Stand</button>
          <button type="button" id="bj-double">Double</button>
        </div>
        <button type="button" class="bj-rebuy" id="bj-rebuy" hidden>Rebuy $1000</button>
        <div class="status" id="bj-status" role="status" aria-live="polite"></div>
      </section>

      <section id="hangman" hidden>
        <h2>Hangman</h2>
        <form class="hm-setup" id="hm-setup" hidden>
          <p class="hm-hint">Type a secret word without letting the guesser see, or let the sign pick one.</p>
          <input id="hm-secret" type="password" maxlength="10" autocomplete="off" autocapitalize="characters"
                 spellcheck="false" placeholder="Secret word" aria-label="Secret word">
          <button class="primary" type="submit">Start</button>
          <button class="hm-secondary" type="button" id="hm-random">Random word</button>
        </form>
        <div id="hm-play" hidden>
          <div class="hm-word" id="hm-word" aria-label="The word so far"></div>
          <div class="hm-misses" id="hm-misses"></div>
          <div class="hm-keys" id="hm-keys" role="group" aria-label="Guess a letter"></div>
          <button class="hm-secondary" type="button" id="hm-reset">New game</button>
        </div>
        <div class="status" id="hm-status" role="status" aria-live="polite"></div>
      </section>

      <section>
        <h2 id="modes-heading">Mode</h2>
        <fieldset class="modes" id="modes" role="radiogroup" aria-labelledby="modes-heading">
          <label class="mode">
            <input type="radio" name="mode" value="normal">
            <span><span class="mode-name">Normal</span><span class="mode-desc">Clock, weather &amp; bus times</span></span>
          </label>
          <label class="mode">
            <input type="radio" name="mode" value="music">
            <span><span class="mode-name">Music</span><span class="mode-desc">Album cover with the song and artist</span></span>
          </label>
          <label class="mode">
            <input type="radio" name="mode" value="sports">
            <span><span class="mode-name">Sports</span><span class="mode-desc">This week's football games, on a loop</span></span>
          </label>
          <label class="mode">
            <input type="radio" name="mode" value="ambient">
            <span><span class="mode-name">Ambient</span><span class="mode-desc">A calm moving scene. Pick one below</span></span>
          </label>
          <fieldset class="scenes" id="scenes" aria-label="Ambient scene" hidden>
            <label class="scene"><input type="radio" name="scene" value="aquarium">Aquarium</label>
            <label class="scene"><input type="radio" name="scene" value="fireplace">Fireplace</label>
            <label class="scene"><input type="radio" name="scene" value="rain">Rain on the window</label>
          </fieldset>
          <label class="mode">
            <input type="radio" name="mode" value="drawing">
            <span><span class="mode-name">Drawing</span><span class="mode-desc">Your pixel art from the Draw tab</span></span>
          </label>
          <label class="mode">
            <input type="radio" name="mode" value="blackjack">
            <span><span class="mode-name">Blackjack</span><span class="mode-desc">Play against the dealer, with the controls above</span></span>
          </label>
          <label class="mode">
            <input type="radio" name="mode" value="hangman">
            <span><span class="mode-name">Hangman</span><span class="mode-desc">One player picks a word, the other guesses letters</span></span>
          </label>
          <label class="mode">
            <input type="radio" name="mode" value="auto">
            <span><span class="mode-name">Auto</span><span class="mode-desc">Music while Spotify plays, sports during live games, otherwise normal<span class="mode-now" id="auto-now"></span></span></span>
          </label>
        </fieldset>
        <div class="status" id="mode-status" role="status" aria-live="polite"></div>
      </section>
    </div>

    <div id="tab-draw" role="tabpanel" aria-labelledby="tab-btn-draw" hidden>
      <section>
        <h2>Draw on the sign</h2>
        <canvas id="paint" width="640" height="320" role="img" aria-label="Drawing canvas, 64 by 32 pixels"></canvas>
        <div class="tools" role="group" aria-label="Tool">
          <button type="button" class="tool" data-tool="pen" aria-pressed="true">Pen</button>
          <button type="button" class="tool" data-tool="brush" aria-pressed="false">Brush</button>
          <button type="button" class="tool" data-tool="eraser" aria-pressed="false">Eraser</button>
          <button type="button" class="tool" data-tool="fill" aria-pressed="false">Fill</button>
        </div>
        <div class="palette" id="palette" role="group" aria-label="Color"></div>
        <div class="draw-actions">
          <button type="button" id="draw-save">Save</button>
          <button type="button" class="danger" id="draw-clear">Clear</button>
        </div>
        <div class="status" id="draw-status" role="status" aria-live="polite"></div>
      </section>
      <section>
        <h2>Saved drawings</h2>
        <div class="gallery" id="gallery"></div>
        <p class="empty" id="gallery-empty">Nothing saved yet. Tap Save to keep a drawing.</p>
      </section>
    </div>

    <div id="tab-settings" role="tabpanel" aria-labelledby="tab-btn-settings" hidden>
      <div id="settings"></div>
      <div class="status" id="settings-status" role="status" aria-live="polite"></div>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  let pin = "";
  try { pin = localStorage.getItem("signPin") || ""; } catch (e) {}

  function savePin(value) {
    pin = value;
    try { localStorage.setItem("signPin", value); } catch (e) {}
  }

  async function api(method, path, body) {
    const options = { method, headers: { "X-Pin": pin } };
    if (body !== undefined) {
      options.headers["Content-Type"] = "application/json";
      options.body = JSON.stringify(body);
    }
    const response = await fetch(path, options);
    const data = await response.json().catch(() => ({}));
    if (response.status === 401) {
      showPin();
      throw new Error("PIN required");
    }
    if (!response.ok) throw new Error(data.error || "Something went wrong");
    return data;
  }

  function showPin(message) {
    $("app").hidden = true;
    $("pin-section").hidden = false;
    $("pin-status").textContent = message || "";
    $("pin").focus();
  }

  $("pin-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    savePin($("pin").value);
    try { await api("GET", "/api/settings"); loadMode(); } catch (e) { showPin("That PIN didn't work"); }
  });

  // ---- Tabs ----
  function showTab(name) {
    ["sign", "draw", "settings"].forEach((tab) => {
      $("tab-" + tab).hidden = tab !== name;
      $("tab-btn-" + tab).setAttribute("aria-selected", String(tab === name));
    });
    if (name === "settings") loadSettings();
    if (name === "sign") { loadMode(); updateLive(); }
    if (name === "draw") { loadDrawing(); loadGallery(); }
  }
  $("tab-btn-draw").addEventListener("click", () => showTab("draw"));
  $("tab-btn-sign").addEventListener("click", () => showTab("sign"));
  $("tab-btn-settings").addEventListener("click", () => showTab("settings"));

  // ---- Mode (radio cards on the Sign tab) ----
  const modeInputs = () => document.querySelectorAll('#modes input[name="mode"]');
  const sceneInputs = () => document.querySelectorAll('#scenes input[name="scene"]');
  let modeSaving = false;

  const MODE_NAMES = { normal: "Normal", music: "Music", sports: "Sports", ambient: "Ambient", drawing: "Drawing", blackjack: "Blackjack",
                       hangman: "Hangman" };

  function showMode(mode, activeMode) {
    modeInputs().forEach((input) => { input.checked = input.value === mode; });
    // The scene choices only show while ambient mode is picked
    $("scenes").hidden = mode !== "ambient";
    // Blackjack controls sit under the live view while blackjack mode is picked
    $("blackjack").hidden = mode !== "blackjack";
    if (mode === "blackjack") loadBlackjack();
    $("hangman").hidden = mode !== "hangman";
    if (mode === "hangman") loadHangman();
    sceneInputs().forEach((input) => { input.checked = input.value === settingValues.ambient_scene; });
    // In auto, say which mode is on screen right now
    $("auto-now").textContent = mode === "auto" && MODE_NAMES[activeMode] ? `Showing ${MODE_NAMES[activeMode]} now` : "";
  }

  async function loadMode() {
    if (modeSaving) return;  // don't overwrite a switch that's still being saved
    try {
      const data = await api("GET", "/api/settings");
      $("pin-section").hidden = true;
      $("app").hidden = false;
      settingValues = data.values;
      showMode(data.values.display_mode, data.active_mode);
    } catch (e) {
      if (e.message !== "PIN required") $("mode-status").textContent = "Can't reach the sign";
    }
  }

  async function switchMode(changes) {
    const previous = settingValues.display_mode;
    const allInputs = [...modeInputs(), ...sceneInputs()];
    modeSaving = true;
    allInputs.forEach((i) => { i.disabled = true; });
    $("mode-status").textContent = "Switching…";
    $("mode-status").classList.remove("error");
    try {
      const data = await api("POST", "/api/settings", changes);
      settingValues = data.values;
      showMode(settingValues.display_mode);
      $("mode-status").textContent = "";
      updateLive();
      setTimeout(loadMode, 1500);  // pick up what auto chose
    } catch (e) {
      showMode(previous);
      $("mode-status").textContent = e.message;
      $("mode-status").classList.add("error");
    } finally {
      modeSaving = false;
      allInputs.forEach((i) => { i.disabled = false; });
    }
  }

  modeInputs().forEach((input) => {
    input.addEventListener("change", () => switchMode({ display_mode: input.value }));
  });
  sceneInputs().forEach((input) => {
    input.addEventListener("change", () => switchMode({ display_mode: "ambient", ambient_scene: input.value }));
  });

  // ---- Settings (rendered from the fields the sign sends) ----
  let settingValues = {};

  function hourLabel(hour) {
    const h = hour % 12 === 0 ? 12 : hour % 12;
    return `${h}:00 ${hour < 12 ? "AM" : "PM"}`;
  }

  function setSettingsStatus(text, isError) {
    $("settings-status").textContent = text;
    $("settings-status").classList.toggle("error", !!isError);
  }

  async function saveSetting(key, value) {
    setSettingsStatus("Saving…");
    try {
      const data = await api("POST", "/api/settings", { [key]: value });
      settingValues = data.values;
      setSettingsStatus("Saved");
      updateDependentSettings();
    } catch (e) {
      await loadSettings();  // put the controls back to what the sign actually has
      setSettingsStatus(e.message, true);
    }
  }

  function updateDependentSettings() {
    // Off/on hours only matter while overnight screen-off is turned on
    const offEnabled = settingValues.screen_off_enabled;
    ["screen_off_start", "screen_off_end"].forEach((key) => {
      const row = document.querySelector(`[data-setting="${key}"]`);
      if (!row) return;
      row.classList.toggle("disabled", !offEnabled);
      row.querySelector("select").disabled = !offEnabled;
    });
  }

  function renderSettings(fields) {
    const container = $("settings");
    container.innerHTML = "";
    const sections = {};
    // Display mode has its own controls on the Sign tab
    // The mode and ambient scene are picked on the Sign tab
    fields.filter((field) => !["display_mode", "ambient_scene"].includes(field.key)).forEach((field) => {
      if (!sections[field.section]) {
        const section = document.createElement("section");
        const heading = document.createElement("h2");
        heading.textContent = field.section;
        section.appendChild(heading);
        container.appendChild(section);
        sections[field.section] = section;
      }
      const row = document.createElement("div");
      row.className = "setting";
      row.dataset.setting = field.key;
      const id = "setting-" + field.key;
      const value = settingValues[field.key];

      if (field.type === "range") {
        row.innerHTML = `<div class="setting-row"><label for="${id}"></label><span class="value"></span></div>
          <input type="range" id="${id}" min="${field.min}" max="${field.max}" step="1">`;
        const input = row.querySelector("input");
        const shown = row.querySelector(".value");
        input.value = value;
        shown.textContent = value + "%";
        input.addEventListener("input", () => { shown.textContent = input.value + "%"; });
        input.addEventListener("change", () => saveSetting(field.key, Number(input.value)));
      } else if (field.type === "text") {
        row.innerHTML = `<div class="setting-row"><label for="${id}"></label>
          <input type="text" class="text-setting" id="${id}" autocomplete="off" autocapitalize="off" spellcheck="false"></div>`;
        const input = row.querySelector("input");
        input.value = value;
        input.maxLength = field.max_length || 40;
        input.placeholder = field.placeholder || "";
        // Saves when you finish editing (tap away or press return)
        input.addEventListener("change", () => saveSetting(field.key, input.value.trim()));
        input.addEventListener("keydown", (e) => { if (e.key === "Enter") input.blur(); });
      } else if (field.type === "toggle") {
        row.innerHTML = `<div class="setting-row"><label for="${id}"></label>
          <span class="switch"><input type="checkbox" role="switch" id="${id}"><span></span></span></div>`;
        const input = row.querySelector("input");
        input.checked = !!value;
        input.addEventListener("change", () => saveSetting(field.key, input.checked));
      } else {
        // "hour" and "choice" are both dropdowns
        row.innerHTML = `<div class="setting-row"><label for="${id}"></label><select id="${id}"></select></div>`;
        const select = row.querySelector("select");
        const options = field.type === "hour"
          ? Array.from({ length: 24 }, (_, hour) => [hour, hourLabel(hour)])
          : field.options;
        options.forEach(([optionValue, label]) => {
          const option = document.createElement("option");
          option.value = String(optionValue);
          option.textContent = label;
          select.appendChild(option);
        });
        select.value = String(value);
        select.addEventListener("change", () => {
          saveSetting(field.key, field.type === "hour" ? Number(select.value) : select.value);
        });
      }
      row.querySelector("label").textContent = field.label;
      sections[field.section].appendChild(row);
    });
    updateDependentSettings();
  }

  async function loadSettings() {
    try {
      const data = await api("GET", "/api/settings");
      settingValues = data.values;
      renderSettings(data.fields);
      setSettingsStatus("");
    } catch (e) {
      if (e.message !== "PIN required") setSettingsStatus("Can't reach the sign", true);
    }
  }

  // ---- Live view: the sign's current frame, drawn as LED dots ----
  const LIVE_INTERVAL_MS = 250;
  const liveCanvas = $("live");
  const liveContext = liveCanvas.getContext("2d");
  const pixelCanvas = document.createElement("canvas");
  pixelCanvas.width = 64;
  pixelCanvas.height = 32;
  const pixelContext = pixelCanvas.getContext("2d", { willReadFrequently: true });
  let liveTimer = null;
  let liveBusy = false;

  function drawLeds(imageData) {
    const cell = liveCanvas.width / 64;
    const radius = cell * 0.42;
    liveContext.fillStyle = "#000";
    liveContext.fillRect(0, 0, liveCanvas.width, liveCanvas.height);
    const px = imageData.data;
    for (let y = 0; y < 32; y++) {
      for (let x = 0; x < 64; x++) {
        const i = (y * 64 + x) * 4;
        const lit = px[i] || px[i + 1] || px[i + 2];
        liveContext.fillStyle = lit ? `rgb(${px[i]},${px[i + 1]},${px[i + 2]})` : "#14171b";
        liveContext.beginPath();
        liveContext.arc((x + 0.5) * cell, (y + 0.5) * cell, radius, 0, Math.PI * 2);
        liveContext.fill();
      }
    }
  }

  async function updateLive() {
    if (liveBusy || document.hidden || $("app").hidden || $("tab-sign").hidden) return;
    liveBusy = true;
    try {
      const response = await fetch("/api/screen.png", { headers: { "X-Pin": pin }, cache: "no-store" });
      if (!response.ok) throw new Error(response.status);
      const bitmap = await createImageBitmap(await response.blob());
      pixelContext.clearRect(0, 0, 64, 32);
      pixelContext.drawImage(bitmap, 0, 0);
      drawLeds(pixelContext.getImageData(0, 0, 64, 32));
      liveCanvas.classList.remove("stale");
      $("live-state").textContent = "Live";
      $("live-state").className = "live-state ok";
    } catch (e) {
      liveCanvas.classList.add("stale");
      $("live-state").textContent = "Can't reach the sign";
      $("live-state").className = "live-state";
    } finally {
      liveBusy = false;
    }
  }

  function startLive() {
    if (!liveTimer) liveTimer = setInterval(updateLive, LIVE_INTERVAL_MS);
    updateLive();
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) updateLive(); });

  // ---- Blackjack ----
  const SUITS = { H: "\u2665", D: "\u2666", C: "\u2663", S: "\u2660" };
  const RESULT_TEXT = { WIN: "You win", BLACKJACK: "Blackjack! You win", PUSH: "Push. Your bet comes back",
                        LOSE: "Dealer wins", BUST: "Bust" };
  let blackjackTimer = null;

  function showHand(element, cards, total) {
    element.textContent = "";
    if (!cards.length) { element.textContent = "\u2014"; return; }
    cards.forEach((card) => {
      const span = document.createElement("span");
      const suit = card.slice(-1);
      span.textContent = card === "?" ? "?? " : card.slice(0, -1) + SUITS[suit] + " ";
      if (suit === "H" || suit === "D") span.className = "red";
      element.append(span);
    });
    element.append(`(${total})`);
  }

  function showBlackjack(game) {
    $("bj-chips").textContent = `$${game.chips}`;
    showHand($("bj-dealer"), game.dealer, game.dealer_total);
    showHand($("bj-player"), game.player, game.player_total);
    const betting = game.phase === "bet" || game.phase === "done";
    $("bj-bets").textContent = "";
    game.bets.forEach((amount) => {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = `$${amount}`;
      button.setAttribute("aria-pressed", String(amount === game.bet));
      button.disabled = !betting || amount > game.chips;
      button.addEventListener("click", () => blackjackAction("bet", amount));
      $("bj-bets").append(button);
    });
    $("bj-deal").hidden = !betting || game.can_rebuy;
    $("bj-deal").textContent = `${game.phase === "done" ? "Deal again" : "Deal"} ($${game.bet})`;
    $("bj-play").hidden = game.phase !== "player";
    $("bj-double").disabled = !game.can_double;
    $("bj-rebuy").hidden = !game.can_rebuy;
    let status = "Pick a bet and deal";
    if (game.phase === "player") status = `Betting $${game.hand_bet}`;
    if (game.phase === "dealer") status = "Dealer's turn\u2026";
    if (game.phase === "done") {
      const amount = game.payout ? ` (${game.payout > 0 ? "+" : "\u2212"}$${Math.abs(game.payout)})` : "";
      status = RESULT_TEXT[game.result] + amount;
    }
    if (game.can_rebuy) status = "Out of chips";
    $("bj-status").textContent = status;
    $("bj-status").classList.remove("error");
    // Follow the dealer's cards as they come out
    clearTimeout(blackjackTimer);
    if (game.phase === "dealer") blackjackTimer = setTimeout(loadBlackjack, 400);
  }

  async function loadBlackjack() {
    try { showBlackjack(await api("GET", "/api/blackjack")); } catch (e) {}
  }

  async function blackjackAction(action, amount) {
    try {
      showBlackjack(await api("POST", "/api/blackjack", { action, amount }));
      updateLive();
    } catch (e) {
      $("bj-status").textContent = e.message;
      $("bj-status").classList.add("error");
    }
  }
  $("bj-deal").addEventListener("click", () => blackjackAction("deal"));
  $("bj-hit").addEventListener("click", () => blackjackAction("hit"));
  $("bj-stand").addEventListener("click", () => blackjackAction("stand"));
  $("bj-double").addEventListener("click", () => blackjackAction("double"));
  $("bj-rebuy").addEventListener("click", () => blackjackAction("rebuy"));

  // ---- Hangman ----
  // Each player can use their own phone; the page checks in often so both stay in step
  let hangmanShown = "";

  function showHangman(game) {
    // Only rebuild when something changed, so a tap never lands on a button being replaced
    const key = JSON.stringify(game);
    if (key === hangmanShown) return;
    hangmanShown = key;
    const over = game.phase === "won" || game.phase === "lost";
    $("hm-setup").hidden = game.phase !== "setup";
    $("hm-play").hidden = game.phase === "setup";
    $("hm-word").textContent = "";
    $("hm-word").className = "hm-word " + game.phase;
    game.letters.forEach((letter, i) => {
      const span = document.createElement("span");
      span.textContent = letter || "";
      if (game.phase === "lost" && !game.guessed.includes(letter)) span.className = "missed";
      $("hm-word").append(span);
    });
    $("hm-word").setAttribute("aria-label", game.letters.map((l) => l || "blank").join(" "));
    $("hm-misses").innerHTML = "";
    const left = game.max_misses - game.misses.length;
    $("hm-misses").append(over ? "" : `${left} wrong guess${left === 1 ? "" : "es"} left`);
    if (game.misses.length) {
      const strong = document.createElement("strong");
      strong.textContent = game.misses.join(" ");
      $("hm-misses").append(over ? "Missed: " : " \u00b7 ", strong);
    }
    $("hm-keys").hidden = over;
    $("hm-keys").textContent = "";
    for (const letter of "ABCDEFGHIJKLMNOPQRSTUVWXYZ") {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = letter;
      if (game.guessed.includes(letter)) {
        button.disabled = true;
        button.className = game.misses.includes(letter) ? "miss" : "hit";
      }
      button.addEventListener("click", () => hangmanAction({ action: "guess", letter }));
      $("hm-keys").append(button);
    }
    $("hm-reset").textContent = over ? "Play again" : "New game";
    let status = "";
    if (game.phase === "won") status = `Solved! The word was ${game.word}`;
    if (game.phase === "lost") status = `Out of guesses. The word was ${game.word}`;
    $("hm-status").textContent = status;
    $("hm-status").classList.remove("error");
  }

  async function loadHangman() {
    try { showHangman(await api("GET", "/api/hangman")); } catch (e) {}
  }

  async function hangmanAction(body) {
    try {
      showHangman(await api("POST", "/api/hangman", body));
      updateLive();
      return true;
    } catch (e) {
      $("hm-status").textContent = e.message;
      $("hm-status").classList.add("error");
      return false;
    }
  }
  $("hm-setup").addEventListener("submit", async (event) => {
    event.preventDefault();
    if (await hangmanAction({ action: "start", word: $("hm-secret").value })) $("hm-secret").value = "";
  });
  $("hm-random").addEventListener("click", () => hangmanAction({ action: "random" }));
  $("hm-reset").addEventListener("click", () => hangmanAction({ action: "reset" }));
  setInterval(() => {
    // Don't wipe a secret word that's being typed
    if (!document.hidden && !$("hangman").hidden && !$("tab-sign").hidden && !$("hm-secret").value) loadHangman();
  }, 1500);

  // ---- Pixel painter ----
  const W = 64, H = 32;
  const PALETTE = ["#ffffff", "#ff2a2a", "#ff8c00", "#ffd800", "#33dd44", "#00c8ff", "#2255ff",
                   "#b040ff", "#ff40b0", "#8b4513", "#808080", "#000000"];
  const paintCanvas = $("paint");
  const paintContext = paintCanvas.getContext("2d");
  const art = new Uint8Array(W * H * 3);
  let tool = "pen";
  let brushColor = [255, 255, 255];
  let painting = false;
  let lastCell = null;
  const pendingPixels = new Map();
  let flushTimer = null;

  function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  function setDrawStatus(text, isError) {
    $("draw-status").textContent = text;
    $("draw-status").classList.toggle("error", !!isError);
  }

  function drawCell(x, y) {
    const cell = paintCanvas.width / W;
    const i = (y * W + x) * 3;
    const lit = art[i] || art[i + 1] || art[i + 2];
    paintContext.fillStyle = "#000";
    paintContext.fillRect(x * cell, y * cell, cell, cell);
    paintContext.fillStyle = lit ? `rgb(${art[i]},${art[i + 1]},${art[i + 2]})` : "#181b20";
    paintContext.beginPath();
    paintContext.arc((x + 0.5) * cell, (y + 0.5) * cell, cell * 0.42, 0, Math.PI * 2);
    paintContext.fill();
  }

  function drawAll() {
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) drawCell(x, y);
  }

  function setCell(x, y, rgb) {
    if (x < 0 || y < 0 || x >= W || y >= H) return;
    const i = (y * W + x) * 3;
    if (art[i] === rgb[0] && art[i + 1] === rgb[1] && art[i + 2] === rgb[2]) return;
    art.set(rgb, i);
    drawCell(x, y);
    pendingPixels.set(y * W + x, [x, y, rgb[0], rgb[1], rgb[2]]);
    if (!flushTimer) flushTimer = setTimeout(flushPixels, 80);
  }

  async function flushPixels() {
    // Send strokes in small batches so the sign follows along while you draw
    flushTimer = null;
    const batch = [...pendingPixels.values()];
    pendingPixels.clear();
    for (let i = 0; i < batch.length; i += 500) {
      try {
        await api("POST", "/api/drawing/pixels", { pixels: batch.slice(i, i + 500) });
        setDrawStatus("");
      } catch (e) {
        setDrawStatus(e.message, true);
      }
    }
  }

  function stamp(x, y) {
    const rgb = tool === "eraser" ? [0, 0, 0] : brushColor;
    const size = tool === "pen" ? 1 : 2;
    for (let dy = 0; dy < size; dy++) for (let dx = 0; dx < size; dx++) setCell(x + dx, y + dy, rgb);
  }

  function line(a, b) {
    // Fill in the cells between two pointer positions so fast strokes stay connected
    let [x0, y0] = a; const [x1, y1] = b;
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
    const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx + dy;
    while (true) {
      stamp(x0, y0);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  }

  function cellAt(event) {
    const rect = paintCanvas.getBoundingClientRect();
    return [Math.floor((event.clientX - rect.left) / rect.width * W), Math.floor((event.clientY - rect.top) / rect.height * H)];
  }

  function toBase64(bytes) {
    let text = "";
    for (let i = 0; i < bytes.length; i += 4096) text += String.fromCharCode(...bytes.subarray(i, i + 4096));
    return btoa(text);
  }

  async function sendWholeDrawing() {
    pendingPixels.clear();
    try {
      await api("POST", "/api/drawing", { image: toBase64(art) });
      setDrawStatus("");
    } catch (e) {
      setDrawStatus(e.message, true);
    }
  }

  function fill(x, y) {
    // Paint-bucket: recolor the connected area of the same color
    const start = (y * W + x) * 3;
    const target = [art[start], art[start + 1], art[start + 2]];
    if (target.every((v, k) => v === brushColor[k])) return;
    const stack = [[x, y]];
    while (stack.length) {
      const [cx, cy] = stack.pop();
      if (cx < 0 || cy < 0 || cx >= W || cy >= H) continue;
      const i = (cy * W + cx) * 3;
      if (art[i] !== target[0] || art[i + 1] !== target[1] || art[i + 2] !== target[2]) continue;
      art.set(brushColor, i);
      stack.push([cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]);
    }
    drawAll();
    sendWholeDrawing();
  }

  paintCanvas.addEventListener("pointerdown", (event) => {
    event.preventDefault();
    const cell = cellAt(event);
    if (tool === "fill") { fill(...cell); return; }
    painting = true;
    lastCell = cell;
    paintCanvas.setPointerCapture(event.pointerId);
    stamp(...cell);
  });
  paintCanvas.addEventListener("pointermove", (event) => {
    if (!painting) return;
    const cell = cellAt(event);
    if (cell[0] !== lastCell[0] || cell[1] !== lastCell[1]) { line(lastCell, cell); lastCell = cell; }
  });
  const endStroke = () => { painting = false; lastCell = null; };
  paintCanvas.addEventListener("pointerup", endStroke);
  paintCanvas.addEventListener("pointercancel", endStroke);

  document.querySelectorAll(".tool").forEach((button) => {
    button.addEventListener("click", () => {
      tool = button.dataset.tool;
      document.querySelectorAll(".tool").forEach((b) => b.setAttribute("aria-pressed", String(b === button)));
    });
  });

  function renderPalette() {
    const palette = $("palette");
    const pick = (button, rgb) => {
      brushColor = rgb;
      palette.querySelectorAll(".color").forEach((b) => b.setAttribute("aria-pressed", String(b === button)));
      if (tool === "eraser") document.querySelector('.tool[data-tool="pen"]').click();
    };
    PALETTE.forEach((hex, index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "color";
      button.style.background = hex;
      button.setAttribute("aria-label", hex === "#000000" ? "black (off)" : hex);
      button.setAttribute("aria-pressed", String(index === 0));
      button.addEventListener("click", () => pick(button, hexToRgb(hex)));
      palette.appendChild(button);
    });
    const custom = document.createElement("label");
    custom.className = "custom-color";
    custom.innerHTML = '<input type="color" value="#00ffaa" aria-label="Custom color">';
    custom.querySelector("input").addEventListener("input", (event) => {
      pick(null, hexToRgb(event.target.value));
    });
    palette.appendChild(custom);
  }

  async function loadDrawing() {
    try {
      const data = await api("GET", "/api/drawing");
      const bytes = Uint8Array.from(atob(data.image), (c) => c.charCodeAt(0));
      art.set(bytes);
      drawAll();
    } catch (e) {
      if (e.message !== "PIN required") setDrawStatus("Can't reach the sign", true);
    }
  }

  async function fetchPngUrl(path) {
    const response = await fetch(path, { headers: { "X-Pin": pin }, cache: "no-store" });
    if (!response.ok) throw new Error(response.status);
    return URL.createObjectURL(await response.blob());
  }

  async function loadGallery() {
    try {
      const data = await api("GET", "/api/drawings");
      const gallery = $("gallery");
      gallery.querySelectorAll("img").forEach((img) => URL.revokeObjectURL(img.src));
      gallery.innerHTML = "";
      $("gallery-empty").hidden = data.drawings.length > 0;
      for (const id of data.drawings) {
        const item = document.createElement("div");
        item.className = "thumb";
        const open = document.createElement("button");
        open.type = "button";
        open.className = "open";
        open.setAttribute("aria-label", "Show this drawing on the sign");
        const img = document.createElement("img");
        img.alt = "";
        open.appendChild(img);
        open.addEventListener("click", async () => {
          try {
            await api("POST", `/api/drawings/${id}/load`, {});
            await loadDrawing();
            setDrawStatus("On the sign");
          } catch (e) { setDrawStatus(e.message, true); }
        });
        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "delete";
        remove.textContent = "×";
        remove.setAttribute("aria-label", "Delete this saved drawing");
        remove.addEventListener("click", async () => {
          try { await api("DELETE", `/api/drawings/${id}`); loadGallery(); } catch (e) { setDrawStatus(e.message, true); }
        });
        item.append(open, remove);
        gallery.appendChild(item);
        fetchPngUrl(`/api/drawings/${id}.png`).then((url) => { img.src = url; }).catch(() => {});
      }
    } catch (e) {
      if (e.message !== "PIN required") setDrawStatus("Can't reach the sign", true);
    }
  }

  $("draw-save").addEventListener("click", async () => {
    await flushPixels();
    try {
      await api("POST", "/api/drawings", {});
      setDrawStatus("Saved");
      loadGallery();
    } catch (e) { setDrawStatus(e.message, true); }
  });
  $("draw-clear").addEventListener("click", () => {
    art.fill(0);
    drawAll();
    sendWholeDrawing();
  });

  renderPalette();
  drawAll();

  loadMode();
  startLive();
  // Keep the mode in sync if it's changed from another phone
  setInterval(() => { if (!document.hidden && !$("app").hidden && !$("tab-sign").hidden) loadMode(); }, 5000);
</script>
</body>
</html>
